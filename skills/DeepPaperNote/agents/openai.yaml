interface:
  display_name: "DeepPaperNote"
  short_description: "Generate a high-quality deep-reading note for one paper with a raw-source manifest workflow and local PDF to workspace Markdown semantics."
  default_prompt: "Use $DeepPaperNote when the user wants to turn a single paper into a high-quality Markdown deep-reading note. Follow the bundled DeepPaperNote workflow to resolve the paper, extract canonical raw source text and a source manifest, plan figure and table placeholders plus decisions, ground the note plan against source sections/pages, write the final note in 繁體中文 with natural 臺灣用語, run lint plus final quality/readability reviews, and save it into the current workspace using the default `raw/` plus `img/` layout."

policy:
  allow_implicit_invocation: true
